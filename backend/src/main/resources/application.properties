spring.application.name=ai-ticket-backend
# 容器平台（如 Vercel）注入 PORT；本地默认 8080
server.port=${PORT:8080}

# Neon Postgres：优先 SPRING_DATASOURCE_URL，否则 DATABASE_URL
# 本地可放根目录 .env（启动时自动加载）；postgresql:// 会规范为 jdbc:postgresql://
# 用户名/密码可通过 SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD 注入（见 DotEnvEnvironmentPostProcessor）
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:ai-ticket-system-jwt-secret-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
