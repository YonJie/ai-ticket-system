spring.application.name=ai-ticket-backend
server.port=8080

# Neon Postgres（通过环境变量注入；本地也可直接填写 JDBC 信息）
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_ticket}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:ai-ticket-system-jwt-secret-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
