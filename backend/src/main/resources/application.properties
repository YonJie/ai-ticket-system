spring.application.name=ai-ticket-backend
# 容器平台（如 Vercel）注入 PORT；本地默认 8080
server.port=${PORT:8080}

# Neon Postgres：优先 SPRING_DATASOURCE_URL，否则 DATABASE_URL
# 支持 postgresql://user:pass@host/db（启动时拆成 JDBC URL + username/password）
# 注意：不要使用 jdbc:postgresql://user:pass@host（PG JDBC 不兼容）
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# 加快冷启动：减少 JDBC 元数据探测耗时
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false
spring.jmx.enabled=false

jwt.secret=${JWT_SECRET:ai-ticket-system-jwt-secret-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# DeepSeek（OpenAI 兼容）；未配置 API Key 时创建工单回退关键词分类 + 固定建议回复
ai.deepseek.api-key=${DEEPSEEK_API_KEY:}
ai.deepseek.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
ai.deepseek.model=${DEEPSEEK_MODEL:deepseek-v4-flash}
ai.deepseek.timeout-ms=${DEEPSEEK_TIMEOUT_MS:8000}
