spring.application.name=ai-ticket-backend
# 容器平台（如 Vercel）注入 PORT；本地默认 8080
server.port=${PORT:8080}

# Neon Postgres：请配置为 JDBC 形式，例如
# jdbc:postgresql://HOST/neondb?sslmode=require
# （不要直接填 postgresql://... 协议，Spring 无法识别）
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:ai-ticket-system-jwt-secret-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
